<section class="card shadow-sm">
  <div class="card-body">
    <h2 class="h5 mb-3"><i class="bi bi-mortarboard me-2"></i>Formación académica</h2>
    @for (item of education; track item.degree) {
      <div class="mb-3">
        <h3 class="h6 mb-0">{{ item.degree }}</h3>
        <small class="text-secondary">{{ item.institution }} · {{ item.period }}</small>
      </div>
    }
  </div>
</section>
